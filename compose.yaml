# Coolify routes the configured domain to the container's internal port 8080.
services:
  osiedle:
    build: .
    image: osiedle:latest
    # optional: OPENROUTER_API_KEY (AI dialogues), OPENROUTER_MODELS, OPENROUTER_DAILY_LIMIT, NEWS_FEEDS
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
